name: Deploy TRACE-5.0 WASM to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'scripts/fetch_wasm.sh'
      - '.github/workflows/deploy_pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # docs/pkg/ is NOT committed — it is fetched from the pinned
      # HyphAeon monorepo release (tag is set in scripts/fetch_wasm.sh).
      - name: Fetch pinned trace50-wasm bundle
        run: bash scripts/fetch_wasm.sh

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
